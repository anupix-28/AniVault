<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniVault</title>

    <link rel="stylesheet" herf="login-page.css">

    <!--inter-front -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!--icons-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div id="main-container">
        <from action="">
            <div id="logo"></div>
            <div id="logo-text"></div>

            <h3>Welcome to AniVault</h3>
            <h6>Login to countinue your anime journey</h6>

            <div class="input-box">
                <span class="material-symbols-outlined">mail</span>
                <input type="text" placeholder="Email" required>
            </div>

            <div class="input-box">
                <span class="material-symbols-outlined">lock</span>
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit" class="btn">Login</button>

            <h6>Don't have an account? <a href="" class="sign-up">Sign Up</a></h6>
        </from>    
    </div>
</body>
</html>
