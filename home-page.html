<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniVault</title>

    <link rel="stylesheet" href="home-page.css">

    <!--inter-front -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!--icons-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>
<body>
    <div class="full-container">

        <div class="Side-Navigation-Bar">
            <div class="logo+text"></div>
            <div class="top-menu-item"></div>
            <div class="bottom-menu-item"></div>
        </div>

        <div class="Top-Navigation-Bar">
            <div class="search-bar"></div>
            <div class="notificatons"></div>
            <div class="user-profile"></div>
        </div>

        <div class="Main-Content">
            <div class="banner"></div>
            <div class="progress-section">
                <div id="watching" class="progress-item"></div>
                <div id="completed" class="progress-item"></div>
                <div id="want-to-watch" class="progress-item"></div>
                <div id="favorites" class="progress-item"></div>
            </div>
            <div class="anime-section">
                <div id="trending" class="content-item">
                    <section class="title-section">
                        <h2 class="title">Trending Anime</h2>
                        <a class="view-all"><p>View All</p>
                        <span class="material-symbols-outlined">arrow_right_alt</span>
                        </a>
                    </section>

                    <section class="anime-cards">
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                    </section>
                </div>

                <div id="popular" class="content-item">
                    <section class="title-section">
                        <h2 class="title">Popular Anime</h2>
                        <a class="view-all"><p>View All</p>
                           <span class="material-symbols-outlined">arrow_right_alt</span>
                        </a>
                    </section>
                    <section class="anime-cards">
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                    </section>
                </div>

                <div id="latest" class="content-item">
                    <section class="title-section">
                        <h2 class="title">Latest Anime</h2>
                        <a class="view-all"><p>View All</p>
                           <span class="material-symbols-outlined">arrow_right_alt</span>
                        </a>
                    </section>
                    <section class="anime-cards">
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                        <div class="anime-card"></div>
                    </section>
                </div>
            </div>
            
        </div> 
    </div>
</body>
</html>
